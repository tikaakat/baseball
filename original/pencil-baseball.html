<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>六角鉛筆ベースボール</title>
<style>
:root{
  --bg:#182620;
  --panel:#213329;
  --panel-light:#2c4133;
  --line:#3a5646;
  --pencil:#f2b632;
  --pencil-dark:#c98f1d;
  --graphite:#2a2621;
  --cream:#f3ecd9;
  --dim:#a9c2ae;
  --away:#6fb0d8;
  --home:#f2b632;
  --good:#7fd858;
  --bad:#e0654f;
  --pink:#e8697d;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(ellipse at top, #24382d 0%, var(--bg) 60%);
  color:var(--cream);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  min-height:100vh;
  padding-bottom:40px;
}
.wrap{max-width:720px;margin:0 auto;padding:14px 12px 0;}

/* ---------- header / nav ---------- */
.hero{
  text-align:center;
  padding:18px 10px 10px;
}
.hero h1{
  font-family:'Courier New',monospace;
  font-weight:900;
  font-size:clamp(20px,6vw,30px);
  letter-spacing:2px;
  margin:0 0 4px;
  color:var(--pencil);
  text-shadow:0 2px 0 var(--pencil-dark);
}
.hero p{margin:0;color:var(--dim);font-size:12.5px;letter-spacing:.5px;}

.tabbar{
  display:flex;gap:6px;overflow-x:auto;padding:10px 0 12px;
  border-bottom:1px solid var(--line);
  scrollbar-width:none;
}
.tabbar::-webkit-scrollbar{display:none;}
.tabbtn{
  flex:0 0 auto;
  background:var(--panel);
  color:var(--dim);
  border:1px solid var(--line);
  border-radius:999px;
  padding:8px 14px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  white-space:nowrap;
}
.tabbtn.active{background:var(--pencil);color:#2a1e04;border-color:var(--pencil-dark);}

.section{padding:16px 2px 8px;}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
}
.card h2{margin:0 0 10px;font-size:15px;color:var(--pencil);letter-spacing:.5px;}
.muted{color:var(--dim);font-size:12.5px;}
.btn{
  background:var(--pencil);
  color:#2a1e04;
  border:none;
  border-radius:10px;
  padding:10px 16px;
  font-weight:800;
  font-size:14px;
  cursor:pointer;
  box-shadow:0 3px 0 var(--pencil-dark);
}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--pencil-dark);}
.btn.secondary{background:var(--panel-light);color:var(--cream);box-shadow:0 3px 0 var(--line);}
.btn.small{padding:6px 10px;font-size:12px;border-radius:8px;}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none;transform:none;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.row.between{justify-content:space-between;}

table{width:100%;border-collapse:collapse;font-size:12.5px;}
th,td{padding:6px 5px;text-align:center;border-bottom:1px solid var(--line);}
th{color:var(--pencil);font-size:11px;letter-spacing:.5px;}
td.name{text-align:left;font-weight:700;}
tr.me td{background:rgba(242,182,50,0.08);}
td.hl{color:var(--pencil);font-weight:900;}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.table-scroll table{min-width:520px;}

/* ---------- schedule list ---------- */
.game-row{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--panel-light);border-radius:10px;padding:9px 12px;margin-bottom:7px;
  font-size:13px;
}
.game-row .vs{flex:1;}
.game-row .vs b{color:var(--pencil);}
.game-row .actions{display:flex;gap:6px;}
.pill{display:inline-block;font-size:10.5px;background:var(--graphite);color:var(--dim);border-radius:6px;padding:2px 6px;margin-left:6px;}

/* ---------- play screen ---------- */
.matchup{text-align:center;font-size:13px;color:var(--dim);margin-bottom:4px;}
.matchup b{color:var(--cream);font-size:15px;}
.scoreboard{
  background:var(--graphite);
  border:2px solid var(--pencil-dark);
  border-radius:12px;
  padding:12px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:10px 0 14px;
  font-family:'Courier New',monospace;
}
.sb-team{text-align:center;flex:1;}
.sb-team .nm{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;margin:0 auto;}
.sb-team .sc{font-size:30px;font-weight:900;color:var(--cream);}
.sb-mid{text-align:center;flex:0 0 auto;padding:0 10px;}
.sb-inning{font-size:13px;color:var(--pencil);font-weight:700;}
.sb-outs{margin-top:5px;}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--panel-light);border:1px solid var(--dim);margin:0 2px;}
.dot.on{background:var(--bad);border-color:var(--bad);}

.linescore{
  font-family:'Courier New',monospace;
  background:var(--graphite);border-radius:10px;
  margin:0 0 12px;
  width:100%;
  table-layout:fixed;
}
.linescore th, .linescore td{padding:3px 1px;font-size:9.5px;border-bottom:1px solid var(--line);text-align:center;}
.linescore th{color:var(--dim);font-weight:700;}
.linescore td.name, .linescore th.namehead{width:50px;}
.linescore td.name{text-align:left;color:var(--cream);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:inherit;padding-left:4px;}
.compact-table{width:100%;table-layout:fixed;}
.compact-table th, .compact-table td{padding:4px 2px;font-size:10px;text-align:center;}
.compact-table td.name{width:34%;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:4px;}
.compact-table th.namehead{width:34%;}
.linescore td.hl{color:var(--pencil);font-weight:900;}

.diamond-wrap{display:flex;justify-content:center;margin:12px 0;}
.diamond{position:relative;width:180px;height:180px;}
.base{
  position:absolute;width:28px;height:28px;
  background:var(--panel-light);border:2px solid var(--line);
  transform:rotate(45deg);border-radius:3px;
  transition:.2s;
}
.base.occ{background:var(--pencil);border-color:var(--pencil-dark);box-shadow:0 0 14px rgba(242,182,50,.7);}
#b-second{top:0;left:50%;margin-left:-14px;}
#b-first{top:50%;right:6px;margin-top:-14px;}
#b-third{top:50%;left:6px;margin-top:-14px;}
#b-home{
  position:absolute;bottom:-4px;left:50%;margin-left:-11px;
  width:22px;height:22px;background:var(--cream);
  clip-path:polygon(50% 0%,100% 40%,100% 100%,0% 100%,0% 40%);
}
.runners-text{text-align:center;font-size:12px;color:var(--dim);margin-bottom:10px;}
.runners-text b{color:var(--pencil);}

.batter-card{
  background:var(--panel-light);border-radius:12px;padding:12px;margin-bottom:12px;
  display:flex;align-items:center;gap:12px;
}
.batter-card .pos{
  background:var(--graphite);color:var(--pencil);font-weight:900;font-size:13px;
  width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.batter-card .info{flex:1;}
.batter-card .info .nm{font-weight:800;font-size:15px;}
.batter-card .stats{font-size:11px;color:var(--dim);margin-top:2px;}
.batter-card .stats span{margin-right:8px;color:var(--pencil);}

.dice-area{display:flex;gap:16px;justify-content:center;align-items:center;margin:16px 0;}
.hex{
  width:76px;height:66px;
  position:relative;
  background:
    repeating-linear-gradient(115deg, rgba(255,255,255,0.22) 0 4px, rgba(0,0,0,0) 4px 14px),
    linear-gradient(100deg, rgba(255,255,255,0.30) 0%, rgba(255,255,255,0) 18%, rgba(0,0,0,0.10) 55%, rgba(255,255,255,0.16) 72%, rgba(0,0,0,0.14) 100%),
    linear-gradient(135deg, var(--pencil), var(--pencil-dark));
  clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%);
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:12px;color:#2a1e04;text-align:center;
  border:2px solid var(--graphite);
  box-shadow:
    inset 0 2px 2px rgba(255,255,255,0.35),
    inset 0 -4px 5px rgba(0,0,0,0.28),
    0 5px 10px rgba(0,0,0,0.4);
}
.hex.dim{opacity:.3;filter:grayscale(1);}
.hex.spin{animation:rollSpin .8s cubic-bezier(.3,.9,.4,1);}
@keyframes rollSpin{
  0%  {transform:rotate(0deg) scale(1);}
  60% {transform:rotate(612deg) scale(1.1);}
  80% {transform:rotate(684deg) scale(0.92);}
  100%{transform:rotate(720deg) scale(1);}
}
.hex-label{font-size:10px;color:var(--dim);text-align:center;margin-top:4px;}

.roll-btn-wrap{text-align:center;margin:10px 0 4px;}
.hold-hint{font-size:10.5px;color:var(--dim);margin-top:5px;}

.gacha-row{
  background:var(--panel-light);border-radius:10px;padding:10px 12px;margin-bottom:8px;
  border:1px solid var(--pencil-dark);
}
.gacha-team{font-size:11px;color:var(--dim);margin-bottom:4px;}
.gacha-swap{font-size:13px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.gacha-out{color:var(--dim);text-decoration:line-through;}
.gacha-arrow{color:var(--pencil);font-weight:900;}
.gacha-in{color:var(--pencil);font-weight:800;}
.roll-btn{font-size:16px;padding:14px 28px;border-radius:14px;}

.play-note{
  text-align:center;min-height:20px;font-size:13px;color:var(--pencil);font-weight:700;margin:6px 0;
}

.ability-flash{
  background:linear-gradient(135deg, var(--pink), #b84a5c);
  color:#fff;text-align:center;font-weight:900;font-size:15px;letter-spacing:.5px;
  border-radius:12px;padding:10px 14px;margin:8px 0;
  box-shadow:0 0 0 2px rgba(255,255,255,0.15) inset, 0 6px 18px rgba(232,105,125,0.55);
  animation:abilityPop .45s cubic-bezier(.34,1.56,.64,1);
}
.ability-flash-note{
  font-size:12px;font-weight:600;opacity:0.92;margin-top:3px;letter-spacing:0;
}
@keyframes abilityPop{
  0%{transform:scale(0.75) translateY(4px);opacity:0;}
  55%{transform:scale(1.07) translateY(0);opacity:1;}
  100%{transform:scale(1) translateY(0);}
}

.log-box{
  background:var(--graphite);border-radius:10px;padding:10px 12px;
  max-height:170px;overflow-y:auto;font-size:12px;color:var(--dim);
  display:flex;flex-direction:column-reverse;gap:4px;
}
.log-box div{border-bottom:1px dashed #333;padding-bottom:4px;}
.log-box div:last-child{border-bottom:none;}

.finish-banner{
  background:var(--panel-light);border:2px solid var(--pencil);border-radius:14px;
  padding:16px;text-align:center;margin-top:14px;
}
.finish-banner .score{font-size:22px;font-weight:900;color:var(--pencil);margin:6px 0 10px;}

/* ---------- team card / roster ---------- */
.team-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:480px){.team-grid{grid-template-columns:1fr;}}
.team-card{
  background:var(--panel-light);border-radius:12px;padding:12px;cursor:pointer;border:1px solid var(--line);
}
.team-card:hover{border-color:var(--pencil);}
.team-card .lg{font-size:10px;color:var(--dim);}
.team-card .tn{font-weight:800;font-size:14px;margin:2px 0;}
.team-card .tg{font-size:11.5px;color:var(--dim);font-style:italic;}
.team-card .rec{margin-top:6px;font-size:12px;font-family:'Courier New',monospace;color:var(--pencil);}

.player-row{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);}
.player-row .pos{width:26px;height:26px;border-radius:50%;background:var(--graphite);color:var(--pencil);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.player-row .nm{flex:1;font-weight:700;font-size:13px;}
.player-row .abl{font-size:10px;color:var(--dim);line-height:1.5;}
.player-row .line{font-size:11px;color:var(--dim);font-family:'Courier New',monospace;text-align:right;}

details.howto{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px;}
details.howto summary{cursor:pointer;color:var(--pencil);font-weight:700;font-size:13px;}
details.howto .rules{font-size:12.5px;color:var(--dim);line-height:1.8;margin-top:8px;}
details.howto table{margin-top:6px;}
details.howto th,details.howto td{border-bottom:1px solid var(--line);padding:4px;}

.flash{
  background:var(--pencil);color:#2a1e04;border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:700;
  margin-bottom:10px;text-align:center;
}
.subtabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.subtabs button{
  background:var(--panel-light);color:var(--dim);border:1px solid var(--line);border-radius:8px;
  padding:6px 10px;font-size:12px;cursor:pointer;
}
.subtabs button.active{background:var(--pencil);color:#2a1e04;font-weight:800;border-color:var(--pencil-dark);}

.edit-btn{
  background:var(--graphite);color:var(--pencil);border:1px solid var(--pencil-dark);
  border-radius:8px;font-size:11px;padding:4px 8px;cursor:pointer;flex:0 0 auto;
}
.modal-overlay{
  position:fixed;inset:0;background:rgba(10,15,12,0.72);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;
}
.modal-box{
  background:var(--panel);border:1px solid var(--pencil-dark);border-radius:14px;
  padding:18px;max-width:360px;width:100%;
}
.modal-box h2{margin:0 0 10px;font-size:15px;color:var(--pencil);}
.modal-box p{font-size:13.5px;line-height:1.6;margin:0 0 4px;}
.modal-box label{display:block;font-size:11.5px;color:var(--dim);margin:10px 0 4px;}
.modal-box input[type="text"]{
  width:100%;background:var(--graphite);border:1px solid var(--line);border-radius:8px;
  color:var(--cream);padding:9px 10px;font-size:14px;
}
.modal-box input[type="text"]:focus{outline:2px solid var(--pencil);}
.modal-box select{
  width:100%;background:var(--graphite);border:1px solid var(--line);border-radius:8px;
  color:var(--cream);padding:9px 10px;font-size:14px;
}
select[data-gachaselect]{
  width:100%;background:var(--graphite);border:1px solid var(--pencil-dark);border-radius:10px;
  color:var(--cream);padding:14px 12px;font-size:15px;min-height:52px;line-height:1.4;
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* =========================================================
   六角鉛筆ベースボール — Pencil Baseball League — engine
   ========================================================= */

const POSITIONS = ["指","捕","一","二","三","遊","左","中","右"];

const SURNAMES = ["鈴木","佐藤","高橋","田中","伊藤","渡辺","山本","中村","小林","加藤",

  {name:"聡",initial:"s"}, {name:"卓也",initial:"t"}, {name:"武",initial:"t"}, {name:"修平",initial:"s"},
  {name:"広大",initial:"k"}, {name:"優",initial:"y"}, {name:"大樹",initial:"d"}, {name:"康平",initial:"k"},

const FOREIGN_NAMES = [
  {surname:"スミス",given:"マイク",initial:"m"}, {surname:"ジョンソン",given:"クリス",initial:"c"},

  {surname:"バティスタ",given:"ラファエル",initial:"r"}, {surname:"キム",given:"ジュン",initial:"j"},

];
// 外国人選手が生まれる確率（NPB風に、日本人選手より少なめ）
const FOREIGN_PLAYER_RATE = 0.16;
function pickPlayerIdentity(excludeNames){
  const ex = excludeNames || [];
  if(Math.random() < FOREIGN_PLAYER_RATE){
    const pool = FOREIGN_NAMES.filter(n=>!ex.includes(n.surname));
    const pick = choice(pool.length ? pool : FOREIGN_NAMES);
    return {surname:pick.surname, given:pick.given, initial:pick.initial};
  }
  const pool = SURNAMES.filter(n=>!ex.includes(n));
  const surname = choice(pool.length ? pool : SURNAMES);
  const g = choice(GIVEN_NAMES);
  return {surname, given:g.name, initial:g.initial};
}

function pickWeightedOrNone(affinity){
  const r = Math.random();
  let acc = 0;
  for(const key of Object.keys(affinity)){
    acc += affinity[key];
    if(r < acc) return key;
  }
  return null;
}
// 打順が決まった後に、打順のタイプに合った特殊能力を割り振る
function assignAbilitiesByBattingOrder(battingOrder){
  battingOrder.forEach((p,slot)=>{
    p.ability = pickWeightedOrNone(ABILITY_AFFINITY[slot] || {});
  });
}

function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function choice(arr){ return arr[randInt(0,arr.length-1)]; }
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function frac(v){ return Math.max(0, Math.min(1, (v-1)/255)); } // 1〜256 → 0〜1
// 失策が起きた際、守備力の低い選手ほど「やらかしやすい」ように重み付きで選ぶ
function pickWeightedFielderForError(roster){
  const weights = roster.map(p=>(256-(p.defense||128))+10);
  const total = weights.reduce((a,b)=>a+b,0);
  let r = Math.random()*total;
  for(let i=0;i<roster.length;i++){ r -= weights[i]; if(r<=0) return roster[i]; }
  return roster[roster.length-1];
}

let PLAYER_SEQ=1;
function emptyStatLine(){ return {pa:0,ab:0,bb:0,h:0,doubles:0,triples:0,hr:0,k:0,rbi:0,r:0,gidp:0,sac:0,errors:0,sb:0,cs:0}; }
// 年齢の成長曲線：内部的に「早熟／普通／大器晩成」を割り振り、ピーク年齢を過ぎたら能力は下がり続ける（内部データのみ、UIには出さない）
const GROWTH_TYPES = ['early','normal','late'];
const GROWTH_PEAK = {early:25, normal:28, late:32};
function applyAging(p){
  p.age = (p.age||24) + 1;
  const peak = GROWTH_PEAK[p.growthType] || 28;
  const dist = p.age - peak;
  let changeChance, direction, magnitude;
  if(dist <= -3){ changeChance=0.45; direction=1; magnitude=randInt(4,14); }         // 成長期：伸びやすい
  else if(dist>=-2 && dist<=1){ changeChance=0.12; direction=1; magnitude=randInt(2,8); } // 全盛期：ごく僅かに伸びることも
  else if(dist<=4){ changeChance=0.45; direction=-1; magnitude=randInt(4,12); }      // 下降開始：緩やかに衰える
  else if(dist<=8){ changeChance=0.65; direction=-1; magnitude=randInt(8,20); }      // はっきり衰える
  else { changeChance=0.8; direction=-1; magnitude=randInt(15,30); }                 // ベテラン：大きく衰える
  if(Math.random()<changeChance){
    const stat = choice(['power','contact','speed']);
    p[stat] = Math.max(1, Math.min(256, p[stat]+direction*magnitude));
  }
}
function createPlayer(pos,identity,youngProspect,debutSeasonOverride){
  const id = identity || pickPlayerIdentity([]);
  return {
    id:'p'+(PLAYER_SEQ++), name:id.surname, given:id.given, initial:id.initial, pos:pos,
    number: null, // 背番号はロースター作成時にチーム単位で重複しないよう割り振る
    power:randInt(1,256), contact:randInt(1,256), speed:randInt(1,256), defense:randInt(1,256), ability:null,
    age: youngProspect ? randInt(18,23) : Math.round((randInt(19,36)+randInt(19,36))/2),
    growthType: choice(GROWTH_TYPES),
    debutSeason: debutSeasonOverride || (DB.currentSeasonNum||1), // 初登場シーズン（歴代成績の在籍表示に使う）
    stats:emptyStatLine(),      // 今シーズンの成績
    career:emptyStatLine(),     // 通算成績（シーズンをまたいで積み上がる）
    awards:{mvp:0, bestNine:0, psMvp:0, rookie:0, goldenGlove:0}, // 受賞歴（シーズンをまたいで積み上がる。リセットされない）
    seasonsPlayed:0,            // 在籍シーズン数

    gachaImmunitySeasons: youngProspect ? 2 : 0, // ガチャ加入直後の2年間は再放出の対象から保護
  };
}
// 背番号（00〜99）をチーム内で重複しないように割り振る
function pickUniformNumber(excludeNumbers){
  const used = new Set(excludeNumbers||[]);
  if(used.size>=100) return randInt(0,99); // 万一枠が尽きたら諦めて重複許容
  let n;
  do { n = randInt(0,99); } while(used.has(n));
  return n;
}
function formatNumber(n){ return n==null ? '--' : String(n).padStart(2,'0'); }
// 能力に応じて守備位置を割り振る：俊足巧打→遊撃/中堅/二塁、パワー→一塁/左翼/捕手、残り→三塁/右翼/DH（指名打者制のため投手は打席に立たない）
function createRoster(){
  const used = [];
  let pool = [];
  const usedNumbers = [];
  for(let i=0;i<9;i++){
    const identity = pickPlayerIdentity(used);
    used.push(identity.surname);
    const p = createPlayer(null, identity);
    p.number = pickUniformNumber(usedNumbers);
    usedNumbers.push(p.number);
    pool.push(p);
  }
  function takeTop(n, scoreFn){
    pool = pool.slice().sort((a,b)=>scoreFn(b)-scoreFn(a));
    const picked = pool.slice(0,n);
    pool = pool.slice(n);
    return picked;
  }
  const speedGroup = takeTop(3, p=>p.speed*1.2+p.contact);
  const powerGroup = takeTop(3, p=>p.power);
  const restGroup = pool;
  const assign = (players, positions)=>players.forEach((p,i)=>{ p.pos = positions[i]; });
  assign(speedGroup, ['遊','中','二']);
  assign(powerGroup, ['一','左','捕']);
  assign(restGroup, ['三','右','指']);
  const order = POSITIONS;
  return [...speedGroup,...powerGroup,...restGroup].sort((a,b)=>order.indexOf(a.pos)-order.indexOf(b.pos));
}
// 打順を能力から機械的に組む（指名打者制。全員が純粋に打力で並ぶ）
function buildBattingOrder(roster){
  let pool = roster.slice();
  const order = [];
  function takeBest(scoreFn){
    pool = pool.slice().sort((a,b)=>scoreFn(b)-scoreFn(a));
    const p = pool[0];
    pool = pool.slice(1);
    return p;
  }
  order.push(takeBest(p=>p.speed*2+p.contact));       // 1番：俊足巧打の先頭打者
  order.push(takeBest(p=>p.contact*2+p.speed));       // 2番：ミート重視のつなぎ役
  order.push(takeBest(p=>p.contact+p.power));         // 3番：総合力の高い好打者
  order.push(takeBest(p=>p.power*2+p.contact));       // 4番：最強のパワーヒッター
  order.push(takeBest(p=>p.power*1.5+p.contact));     // 5番：もう一人の長距離砲
  order.push(takeBest(p=>p.contact+p.power+p.speed));
  order.push(takeBest(p=>p.contact+p.power+p.speed));
  order.push(takeBest(p=>p.contact+p.power+p.speed));
  order.push(takeBest(p=>p.contact+p.power+p.speed));  // 9番：残った中で最も打力の低い選手
  assignAbilitiesByBattingOrder(order);
  return order;
}

// オフシーズン補強ガチャ：全12球団、それぞれ1名だけを新人にごっそり入れ替える。
// 自チームは選択式、他チームは「成績が振るわない選手」を自動選定する。
function performanceScore(p){
  if(p.stats.ab >= 10) return opsOfStats(p.stats); // 実績があればOPSで判断
  return (frac(p.power)+frac(p.contact)+frac(p.speed))/3; // 出場が少ない選手は基礎能力で代用（OPSと近い0〜1スケールに正規化）
}
// 打順は選手が自分で入れ替えるのではなく、シーズンの成績（実績が無ければ基礎能力）に応じて毎年自動で組み直す
// 打力上位から、3番→4番→2番→5番→1番→6番→7番→8番→9番の優先順で割り当てる（能力自体は選手に固定のまま、位置だけ入れ替える）
const BATTING_SLOT_PRIORITY = [3,4,2,5,1,6,7,8,9];
function reorderBattingOrderByPerformance(t){
  const ranked = t.roster.slice().sort((a,b)=>performanceScore(b)-performanceScore(a));
  const newOrder = new Array(9);
  ranked.forEach((p,i)=>{ newOrder[BATTING_SLOT_PRIORITY[i]-1] = p; });
  t.battingOrder = newOrder;
}
function worstPerformer(t){
  // ガチャで加入して2年未満の選手は、放出候補となる選手が2人以上いる限り保護する
  const eligible = t.roster.filter(p=>!(p.gachaImmunitySeasons>0));
  const pool = eligible.length>=2 ? eligible : t.roster;
  return pool.slice().sort((a,b)=>performanceScore(a)-performanceScore(b))[0];
}
// 他球団のガチャ判断：年齢と成績を加味して「今回は放出する/しない」をいい感じに決める
// 若くて伸びしろがある選手は温存されやすく、高齢かつ成績不振の選手は放出されやすい
function shouldReleasePlayer(p){
  const perf = performanceScore(p); // OPSに近いスケール（目安：.500未満は不振、.800超は好調）
  let chance = 0.45;
  if(p.age>=34) chance += 0.35;
  else if(p.age>=30) chance += 0.15;
  else if(p.age<=22) chance -= 0.35;
  else if(p.age<=25) chance -= 0.15;
  if(perf < 0.45) chance += 0.2;
  else if(perf > 0.8) chance -= 0.3;
  chance = Math.max(0.05, Math.min(0.95, chance));
  return Math.random() < chance;
}
// 退団する選手の通算成績をチームのOB名簿に残す（今シーズン分もその場で通算に加算してから記録）
function retirePlayer(team, player){
  const totalCareer = emptyStatLine();
  accumulateStatLine(totalCareer, player.career);
  accumulateStatLine(totalCareer, player.stats);
  if(!team.alumni) team.alumni = [];
  team.alumni.push({
    name: player.name, pos: player.pos, age: player.age,
    seasonsPlayed: (player.seasonsPlayed||0) + (player.stats.pa>0 ? 1 : 0),
    debutSeason: player.debutSeason||1, lastSeason: DB.currentSeasonNum||1,
    career: totalCareer,
    awards: Object.assign({mvp:0,bestNine:0,psMvp:0,rookie:0,goldenGlove:0}, player.awards||{}),
  });
}
// mySelectedPlayerId: 通常は選手ID／'__skip__'なら自チームは今回は放出しない／未指定(null)なら全球団を年齢・成績で自動判定
function gachaSwapAllTeams(myTeamId, mySelectedPlayerId){
  const results = [];
  DB.teams.forEach(t=>{
    const isMine = t.id===myTeamId;
    let idx = -1, skip = false;

    if(isMine && mySelectedPlayerId==='__skip__'){
      skip = true;
    } else if(isMine && mySelectedPlayerId){
      idx = t.roster.findIndex(p=>p.id===mySelectedPlayerId);
    } else if(isMine){
      idx = t.roster.findIndex(p=>p.id===worstPerformer(t).id);
    } else {
      const candidate = worstPerformer(t);
      if(shouldReleasePlayer(candidate)){
        idx = t.roster.findIndex(p=>p.id===candidate.id);
      } else {
        skip = true;
      }
    }

    if(skip || idx<0){
      results.push({team:t, out:null, in:null, slot:null, skipped:true});
      return;
    }
    const outgoing = t.roster[idx];
    retirePlayer(t, outgoing); // 通算成績をOB(退団選手)としてチームに残しておく
    const otherNames = t.roster.filter((p,i)=>i!==idx).map(p=>p.name);
    const identity = pickPlayerIdentity(otherNames);
    const incoming = createPlayer(outgoing.pos, identity, true, (DB.currentSeasonNum||1)+1); // 新加入は若手寄りの年齢で生成、来シーズンからの在籍扱い
    incoming.number = pickUniformNumber(t.roster.filter((p,i)=>i!==idx).map(p=>p.number));
    t.roster[idx] = incoming;
    const boIdx = t.battingOrder.indexOf(outgoing);
    if(boIdx>=0){
      t.battingOrder[boIdx] = incoming;
      incoming.ability = pickWeightedOrNone(ABILITY_AFFINITY[boIdx] || {});
    }
    results.push({team:t, out:outgoing, in:incoming, slot: boIdx>=0 ? boIdx+1 : null, skipped:false});
  });
  DB.gachaDoneThisCycle = true;
  return results;
}
function createSchedule(teams){
  const leagueA=teams.filter(t=>t.league===LEAGUE_CODES[0]);
  const leagueB=teams.filter(t=>t.league===LEAGUE_CODES[1]);
  const games=[]; let gid=1;
  function roundRobinN(list, n){
    const half = n/2;
    for(let i=0;i<list.length;i++) for(let j=i+1;j<list.length;j++){
      for(let k=0;k<half;k++){
        games.push({id:'g'+(gid++),home:list[i].id,away:list[j].id,played:false,result:null});
        games.push({id:'g'+(gid++),home:list[j].id,away:list[i].id,played:false,result:null});
      }
    }
  }
  // NPB風: 同一24回戦(計120試合)＋交流戦4回戦(計24試合)＝1チーム144試合
  roundRobinN(leagueA, 24);
  roundRobinN(leagueB, 24);
  leagueA.forEach(a=>{ leagueB.forEach(b=>{
    for(let k=0;k<2;k++){
      games.push({id:'g'+(gid++),home:a.id,away:b.id,played:false,result:null});
      games.push({id:'g'+(gid++),home:b.id,away:a.id,played:false,result:null});
    }
  });});
  return shuffle(games).map((g,i)=>Object.assign({},g,{order:i+1}));
}

const P1_WEIGHTS = {hit:0.155, walk:0.085, flyout:0.185, groundout:0.22, k:0.155, otto:0.20};
const P2_WEIGHTS = {double:0.215, hr:0.115, k:0.185, flyout:0.22, groundout:0.265};
function weightedChoice(weightMap){
  const r = Math.random();
  let acc = 0;
  const keys = Object.keys(weightMap);
  for(const key of keys){
    acc += weightMap[key];
    if(r < acc) return key;
  }
  return keys[keys.length-1];
}
function rollPencil1(){ return weightedChoice(P1_WEIGHTS); }
function rollPencil2(){ return weightedChoice(P2_WEIGHTS); }
function emptyBases(){ return {first:null,second:null,third:null}; }

function resolveContact(result,batter,bases,mgrGidpResist){
  mgrGidpResist = mgrGidpResist || 0;
  const orig=bases;
  const nb={first:null,second:null,third:null};
  let scored=[], outsAdded=0, desc='', isSacFly=false, isGidp=false, gidpEscaped=false;

  function forceChain(){
    const chain=[];
    if(orig.first) chain.push('first');
    if(orig.first && orig.second) chain.push('second');
    if(orig.first && orig.second && orig.third) chain.push('third');
    return chain;
  }

  if(result==='hit'){
    if(orig.third) scored.push(orig.third);
    if(orig.second) scored.push(orig.second);
    if(orig.first){
      if(Math.random()<Math.max(0,frac(batter.speed)-0.4)*0.25) nb.third=orig.first;
      else nb.second=orig.first;
    }
    nb.first=batter;
    desc=`${batter.name}、単打で出塁！`;
  } else if(result==='double'){
    if(orig.third) scored.push(orig.third);
    if(orig.second) scored.push(orig.second);
    if(orig.first) scored.push(orig.first);
    nb.second=batter;
    desc=`${batter.name}、二塁打！`;
  } else if(result==='triple'){
    if(orig.third) scored.push(orig.third);
    if(orig.second) scored.push(orig.second);
    if(orig.first) scored.push(orig.first);
    nb.third=batter;
    desc=`${batter.name}、三塁打！`;
  } else if(result==='hr'){
    if(orig.third) scored.push(orig.third);
    if(orig.second) scored.push(orig.second);
    if(orig.first) scored.push(orig.first);
    scored.push(batter);
    desc=`${batter.name}、ホームラン！！`;
  } else if(result==='flyout'){
    outsAdded=1;
    nb.first=orig.first; nb.second=orig.second; nb.third=null;
    if(orig.third){ scored.push(orig.third); isSacFly=true; desc=`${batter.name}、犠牲フライ。三塁走者タッチアップ。`; }
    else desc=`${batter.name}、外野フライアウト。`;
  } else if(result==='groundout'){
    const chain=forceChain();
    if(chain.length===0){
      outsAdded=1;
      nb.first=orig.first; nb.second=orig.second; nb.third=orig.third;
      desc=`${batter.name}、内野ゴロアウト。`;
    } else {
      const targetKey=chain[chain.length-1];
      const advanceMap={first:'second',second:'third'};
      nb.first=orig.first; nb.second=orig.second; nb.third=orig.third;
      nb[targetKey]=null;
      if(Math.random()<frac(batter.speed)*0.18 + mgrGidpResist) gidpEscaped=true;
      if(!gidpEscaped && batter.ability==='steady' && Math.random()<0.12) gidpEscaped=true;
      isGidp=!gidpEscaped;
      outsAdded=gidpEscaped?1:2;
      const others=chain.filter(k=>k!==targetKey).reverse();
      others.forEach(k=>{ const dest=advanceMap[k]; nb[dest]=orig[k]; nb[k]=null; });
      if(gidpEscaped){ nb.first=batter; desc=`${batter.name}、ゴロ…併殺崩れ！一塁生きる。`; }
      else desc=`${batter.name}、ゲッツー！`;
    }
  } else if(result==='k'){
    outsAdded=1;
    nb.first=orig.first; nb.second=orig.second; nb.third=orig.third;
    desc=`${batter.name}、三振。`;
  } else if(result==='walk'){
    nb.first=batter;
    if(orig.first){
      nb.second=orig.first;
      if(orig.second){
        nb.third=orig.second;
        if(orig.third) scored.push(orig.third);
      } else {
        nb.third=orig.third;
      }
    } else {
      nb.second=orig.second;
      nb.third=orig.third;
    }
    desc=`${batter.name}、四球で出塁。`;
  } else if(result==='error'){
    nb.first=batter;
    if(orig.first){
      nb.second=orig.first;
      if(orig.second){
        nb.third=orig.second;
        if(orig.third) scored.push(orig.third);
      } else {
        nb.third=orig.third;
      }
    } else {
      nb.second=orig.second;
      nb.third=orig.third;
    }
    desc=`${batter.name}、相手の失策で出塁。`;
  }
  return {nb,outsAdded,scored,desc,isSacFly,isGidp};
}

function finalizeAtBat(batter,p1,p2,bases,game){
  let result=p1, usedPencil2=false;
  if(p1==='otto'){ usedPencil2=true; result=p2; }
  let abilityNote=null;
  let abilityKey=null; // どの"名前つき特殊能力"が結果を覆したか（演出用。基礎ステータスの微調整は含めない）

  // 監督効果：能力の実質倍率を、以降の計算に使う打者オブジェクトへ反映する（記録は元のbatterに対して行う）
  const realBatter = batter;
  let mgrGidpResist = 0, mgrErrorMult = 1;
  if(game){
    const battingKey = currentBattingKey(game);
    const fieldingKey = battingKey==='home' ? 'away' : 'home';
    const battingMgr = game[battingKey] && game[battingKey].manager;
    const fieldingMgr = game[fieldingKey] && game[fieldingKey].manager;
    if(battingMgr){
      if(battingMgr.statMult){
        const m = battingMgr.statMult;
        batter = Object.assign({}, batter, {
          power: Math.max(1, Math.min(256, Math.round(batter.power*(m.power||1)))),
          contact: Math.max(1, Math.min(256, Math.round(batter.contact*(m.contact||1)))),
          speed: Math.max(1, Math.min(256, Math.round(batter.speed*(m.speed||1)))),
        });
      }
      if(battingMgr.gidpResist) mgrGidpResist = battingMgr.gidpResist;
      if(battingMgr.walkBoost && result==='k' && Math.random()<0.15*(battingMgr.walkBoost-1)){
        result='walk';
        if(!abilityNote) abilityNote=`${batter.name}、監督の待球方針で四球を選ぶ`;
      }
    }
    if(fieldingMgr && fieldingMgr.errorReduction) mgrErrorMult = fieldingMgr.errorReduction;
    // 守備力：野手陣の平均守備力が高いほど失策が起きにくい
    const fieldingTeam = game[fieldingKey];
    if(fieldingTeam && fieldingTeam.roster && fieldingTeam.roster.length){
      const avgDef = fieldingTeam.roster.reduce((s,p)=>s+(p.defense||128),0)/fieldingTeam.roster.length;
      mgrErrorMult *= (1.5 - frac(avgDef)*0.9); // 守備力最低で1.5倍、最高で0.6倍
    }
  }

  // 本塁打だと思ったが、パワー不足でフェンスまで届かないことがある（ダイス直後の生の結果にのみ適用。能力で作った本塁打は対象外）
  if(result==='hr'){
    const shortChance = Math.max(0,0.5-frac(batter.power))*0.24; // パワーが低いほど届かない確率が上がる（最大12%）
    if(Math.random()<shortChance){
      if(Math.random()<0.5){ result='flyout'; abilityNote=`${batter.name}、特大の当たりも本塁打には届かず...`; }
      else { result='double'; abilityNote=`${batter.name}、フェンス直撃！本塁打かと思ったら二塁打`; }
    }
  }

  const isFirstPaThisGame = game && !game.battedThisGame.has(realBatter.id);
  const isRISP = !!(bases.second || bases.third);
  const isBasesLoaded = !!(bases.first && bases.second && bases.third);
  let isTrailing=false, isLuckySeven=false;
  if(game){
    const battingKey = currentBattingKey(game);
    const oppKey = battingKey==='home' ? 'away' : 'home';
    isTrailing = game.score[battingKey] < game.score[oppKey];
    isLuckySeven = game.inning===7;
  }
  const outResults = ['flyout','groundout','k'];

  // 特殊能力①：一番打者向き（その試合の最初の打席で凡打がヒットに化ける）
  if(batter.ability==='leadoff' && isFirstPaThisGame && outResults.includes(result) && Math.random()<0.25){
    result='hit'; abilityNote=`${batter.name}、第一打席の勢いでヒットに！`; abilityKey='leadoff';
  }
  // 特殊能力⑤：逆転の一振り（自チームがビハインドの場面で凡打がヒットに化ける）
  if(!abilityKey && batter.ability==='comeback' && isTrailing && outResults.includes(result) && Math.random()<0.25){
    result='hit'; abilityNote=`${batter.name}、劣勢をはね返す一打！`; abilityKey='comeback';
  }
  // 特殊能力⑥：ラッキーセブン（7回に凡打がヒットに化ける）
  if(!abilityKey && batter.ability==='luckySeven' && isLuckySeven && outResults.includes(result) && Math.random()<0.25){
    result='hit'; abilityNote=`${batter.name}、ラッキーセブンで魅せる！`; abilityKey='luckySeven';
  }
  // 特殊能力②：勝負強い（得点圏で長打に化ける）
  if(batter.ability==='clutch' && isRISP){
    if(result==='hit' && Math.random()<0.30){ result='double'; abilityNote=`${batter.name}、勝負強さを発揮！二塁打に`; abilityKey='clutch'; }
    else if(result==='double' && Math.random()<0.30){ result='hr'; abilityNote=`${batter.name}、勝負強さを発揮！本塁打に`; abilityKey='clutch'; }
  }
  // 特殊能力⑦：満塁男（満塁で長打に化ける。勝負強いより強力）
  if(batter.ability==='basesLoadedHero' && isBasesLoaded){
    if(result==='hit' && Math.random()<0.35){ result='double'; abilityNote=`${batter.name}、満塁男の本領発揮！二塁打に`; abilityKey='basesLoadedHero'; }
    else if(result==='double' && Math.random()<0.35){ result='hr'; abilityNote=`${batter.name}、満塁男の本領発揮！満塁本塁打だ！`; abilityKey='basesLoadedHero'; }
  }
  // 特殊能力③：一発長打（状況を問わず二塁打が本塁打に化けやすい）
  if(batter.ability==='bigSwing' && result==='double' && Math.random()<0.22){
    result='hr'; abilityNote=`${batter.name}のフルスイングでスタンドへ`; abilityKey='bigSwing';
  }

  // 基礎ステータス：ミート／パワー（"能力"とは別枠の微調整。1〜256の全域で連続的に差が出るよう設計）
  if(result==='k'){
    const chance = Math.max(0, frac(batter.contact)-0.5)*0.50;
    if(Math.random()<chance){ result='groundout'; if(!abilityNote) abilityNote=`${batter.name}のミートで粘って内野ゴロに`; }
  } else if(result==='hit'){
    const chance = Math.max(0, 0.5-frac(batter.contact))*0.40;
    if(Math.random()<chance){ result='groundout'; if(!abilityNote) abilityNote=`${batter.name}、詰まった当たりでゴロに`; }
  }
  if(result==='double'){
    const upChance = Math.max(0, frac(batter.power)-0.5)*0.50;
    const downChance = Math.max(0, 0.5-frac(batter.power))*0.40;
    if(Math.random()<upChance){ result='hr'; if(!abilityNote) abilityNote=`${batter.name}のパワーでスタンドイン`; }
    else if(Math.random()<downChance){ result='hit'; if(!abilityNote) abilityNote=`${batter.name}、伸びを欠いて単打止まり`; }
  }
  // 走力：単打が俊足で二塁打に伸びる／二塁打が俊足で三塁打に伸びる（3塁打はここでのみ発生）
  if(result==='hit'){
    const chance = Math.max(0, frac(batter.speed)-0.4)*0.25;
    if(Math.random()<chance){ result='double'; if(!abilityNote) abilityNote=`${batter.name}、俊足を飛ばして二塁打に`; }
  } else if(result==='double'){
    const chance = frac(batter.speed)*0.20;
    if(Math.random()<chance){ result='triple'; if(!abilityNote) abilityNote=`${batter.name}、俊足で三塁打を陥れる！`; }
  }
  // 特殊能力④：堅実（三振を粘ってゴロに変える一助）
  if(!abilityKey && batter.ability==='steady' && result==='k' && Math.random()<0.12){
    result='groundout'; abilityNote=`${batter.name}、堅実なバットコントロールでゴロに`; abilityKey='steady';
  }
  // 失策：ゴロ・フライのアウトが、まれに相手の失策で出塁に変わる（打者の能力とは無関係。相手監督が守備重視だと起きにくい）
  if((result==='groundout' || result==='flyout') && Math.random()<0.03*mgrErrorMult){
    result='error';
  }

  if(game) game.battedThisGame.add(realBatter.id);
  const play=resolveContact(result,batter,bases,mgrGidpResist);
  return Object.assign({},play,{p1,p2,usedPencil2,abilityNote,abilityKey,batter:realBatter,rawResult:result});
}
function resolveAtBat(batter,bases,game){
  const p1=rollPencil1();
  const p2=(p1==='otto')?rollPencil2():null;
  return finalizeAtBat(batter,p1,p2,bases,game);
}

function newGame(homeTeam,awayTeam,scheduleId){
  return {
    scheduleId:scheduleId||null, home:homeTeam, away:awayTeam,
    inning:1, half:'top', outs:0, bases:emptyBases(),
    score:{home:0,away:0}, orderIdx:{home:0,away:0}, log:[],
    finished:false, winner:null, pencilStage:'ready', pendingP1:null, lastPlay:null,
    battedThisGame:new Set(),
    inningRuns:{home:[],away:[]}, hits:{home:0,away:0}, errors:{home:0,away:0},
  };
}
function currentBattingKey(game){ return game.half==='top'?'away':'home'; }
function currentBatter(game){ const k=currentBattingKey(game); return game[k].battingOrder[game.orderIdx[k]]; }
function pushLog(game,text){
  game.log.push(`${game.inning}回${game.half==='top'?'表':'裏'} ${text}`);
  if(game.log.length>200) game.log.shift();
}

function applyPlay(game,play){
  const battingKey=currentBattingKey(game);
  const fieldingKey=battingKey==='home'?'away':'home';
  const b=play.batter;
  const outsAfter=Math.min(game.outs+play.outsAdded,3);
  const madeThirdOut=(game.outs+play.outsAdded)>=3;
  const isForceOrFly=(play.rawResult==='flyout'||play.rawResult==='groundout');
  const negateRuns=madeThirdOut && isForceOrFly;
  const runsThisPlay=negateRuns?[]:play.scored;
  const sacFlyCounts=play.isSacFly && !negateRuns;
  const target = game.seriesKey ? b.psStats : b.stats; // ポストシーズンの成績はレギュラーシーズンの成績と分離して集計する

  // 掲示板用：この回にまだ記録が無ければ0点で欄を作っておく（試合を通じた安打・失策も加算）
  if(game.inningRuns){
    const arr = game.inningRuns[battingKey];
    while(arr.length < game.inning) arr.push(0);
  }

  target.pa++;
  if(!sacFlyCounts && play.rawResult!=='walk') target.ab++; // 失策での出塁も打数には含める（公式記録と同様）
  if(play.rawResult==='walk') target.bb++;
  if(['hit','double','triple','hr'].includes(play.rawResult)){
    target.h++;
    if(play.rawResult==='double') target.doubles++;
    if(play.rawResult==='triple') target.triples++;
    if(play.rawResult==='hr') target.hr++;
    if(game.hits) game.hits[battingKey]++;
  }
  if(play.rawResult==='k') target.k++;
  if(play.isGidp) target.gidp++;
  if(sacFlyCounts) target.sac++;
  if(play.rawResult==='error' && game.errors){
    game.errors[fieldingKey]++;
    // 失策を相手チームの守備陣からランダムに1人選んで個人成績に加算（ゴールデングラブ賞の集計に使う）
    const fieldingTeam = game[fieldingKey];
    if(fieldingTeam && fieldingTeam.roster && fieldingTeam.roster.length){
      const fielder = pickWeightedFielderForError(fieldingTeam.roster);
      (game.seriesKey ? fielder.psStats : fielder.stats).errors++;
    }
  }
  if(runsThisPlay.length){
    if(play.rawResult!=='error') target.rbi+=runsThisPlay.length; // 失策での生還は打点にしない
    runsThisPlay.forEach(p=>{ (game.seriesKey ? p.psStats : p.stats).r++; });
    game.score[battingKey]+=runsThisPlay.length;
    if(game.inningRuns) game.inningRuns[battingKey][game.inning-1] += runsThisPlay.length;
  }
  game.bases=play.nb;
  game.outs=outsAfter;

  let text=play.desc;
  if(play.abilityNote) text+=` （${play.abilityNote}）`;
  if(runsThisPlay.length) text+=` ${runsThisPlay.length}点入る！`;
  pushLog(game,text);
  game.lastPlay=Object.assign({},play,{runsThisPlay});

  game.orderIdx[battingKey]=(game.orderIdx[battingKey]+1)%9;

  checkHalfInningEnd(game);
}
function checkHalfInningEnd(game){
  if(game.outs>=3){
    game.outs=0; game.bases=emptyBases();
    if(game.half==='top'){
      game.half='bottom';
      if(game.inning>=9 && game.score.home>game.score.away){ finishGame(game); return; }
    } else {
      game.inning++; game.half='top';
      if(game.inning-1>=9 && game.score.home!==game.score.away){
        game.inning--; finishGame(game); return;
      }
      if(game.inning>15){ finishGame(game,true); return; }
    }
  } else {
    if(game.half==='bottom' && game.inning>=9 && game.score.home>game.score.away){ finishGame(game); return; }
  }
}
// 盗塁：1塁に足の速い走者がいると、打席の前に盗塁を試みることがある（2塁が空いている場合のみ）
function attemptSteal(game){
  if(game.finished) return null;
  const runner = game.bases.first;
  if(!runner || game.bases.second) return null;
  const runnerKey = currentBattingKey(game); // 走者は打者と同じ攻撃側チームに所属
  const runnerMgr = game[runnerKey] && game[runnerKey].manager;
  const stealMult = (runnerMgr && runnerMgr.stealBoost) || 1;
  const attemptChance = Math.max(0, frac(runner.speed)-0.3)*0.22*stealMult;
  if(Math.random() >= attemptChance) return null;
  const successChance = 0.55 + frac(runner.speed)*0.35;
  const success = Math.random() < successChance;
  const target = game.seriesKey ? runner.psStats : runner.stats;
  if(success){
    target.sb = (target.sb||0)+1;
    game.bases.second = runner;
    game.bases.first = null;
    pushLog(game, `${runner.name}、盗塁成功！2塁へ`);
  } else {
    target.cs = (target.cs||0)+1;
    game.bases.first = null;
    game.outs = Math.min(3, game.outs+1);
    pushLog(game, `${runner.name}、盗塁失敗…`);
    checkHalfInningEnd(game);
  }
  return {success, runner};
}

function finishGame(game,forcedTie){
  game.finished=true;
  if(forcedTie || game.score.home===game.score.away) game.winner='tie';
  else game.winner = game.score.home>game.score.away?'home':'away';
  pushLog(game,`試合終了　${game.away.name} ${game.score.away} - ${game.score.home} ${game.home.name}`);

  if(game.seriesKey){
    const s = DB.postseason.series[game.seriesKey];
    if(game.winner!=='tie'){
      const winnerTeam = game.winner==='home' ? game.home : game.away;
      if(winnerTeam.id===s.teamA.id) s.winsA++; else s.winsB++;
      s.games.push({homeId:game.home.id, awayId:game.away.id, scoreHome:game.score.home, scoreAway:game.score.away, winnerId:winnerTeam.id, tie:false});
      if(s.winsA>=s.winsToClinch) s.winner=s.teamA;
      else if(s.winsB>=s.winsToClinch) s.winner=s.teamB;
    } else {
      s.games.push({homeId:game.home.id, awayId:game.away.id, scoreHome:game.score.home, scoreAway:game.score.away, winnerId:null, tie:true});
    }
    return;
  }

  game.home.runsFor+=game.score.home; game.home.runsAgainst+=game.score.away;
  game.away.runsFor+=game.score.away; game.away.runsAgainst+=game.score.home;
  if(game.winner==='home'){ game.home.wins++; game.away.losses++; }
  else if(game.winner==='away'){ game.away.wins++; game.home.losses++; }
  else { game.home.ties++; game.away.ties++; }
  // 監督の通算成績にも同時に加算する（レギュラーシーズンのみ。監督在任中の実績として蓄積）
  [game.home, game.away].forEach(t=>{ if(t.manager) t.manager.careerGames = (t.manager.careerGames||0)+1; });
  if(game.winner==='home'){ if(game.home.manager) game.home.manager.wins=(game.home.manager.wins||0)+1; if(game.away.manager) game.away.manager.losses=(game.away.manager.losses||0)+1; }
  else if(game.winner==='away'){ if(game.away.manager) game.away.manager.wins=(game.away.manager.wins||0)+1; if(game.home.manager) game.home.manager.losses=(game.home.manager.losses||0)+1; }
  else { if(game.home.manager) game.home.manager.ties=(game.home.manager.ties||0)+1; if(game.away.manager) game.away.manager.ties=(game.away.manager.ties||0)+1; }

  if(game.scheduleId){
    const g=DB.schedule.find(s=>s.id===game.scheduleId);
    if(g){ g.played=true; g.result={home:game.score.home,away:game.score.away,winner:game.winner}; }
  }
}

function rollStep(game){
  if(game.finished) return null;
  if(game.pencilStage==='ready'){
    attemptSteal(game); // 打席が始まる前に、1塁走者が盗塁を試みることがある（ログに残るだけで、クリックは消費しない）
    if(game.finished) return {stage:'resolved', play:null, stealOnly:true};
  }
  const batter=currentBatter(game);
  if(game.pencilStage==='ready'){
    const p1=rollPencil1();
    game.pendingP1=p1;
    if(p1==='otto'){
      game.pencilStage='awaitingPencil2';
      pushLog(game,`${batter.name} … 1本目「おっと」！ 2本目の鉛筆へ`);
      return {stage:'otto',p1,batter};
    } else {
      const play=finalizeAtBat(batter,p1,null,game.bases,game);
      applyPlay(game,play);
      return {stage:'resolved',p1,p2:null,play};
    }
  } else {
    const p1=game.pendingP1;
    const p2=rollPencil2();
    game.pencilStage='ready'; game.pendingP1=null;
    const play=finalizeAtBat(batter,p1,p2,game.bases,game);
    applyPlay(game,play);
    return {stage:'resolved',p1,p2,play};
  }
}
function autoSimGame(game){
  let it=0;
  while(!game.finished && it<5000){
    attemptSteal(game);
    if(game.finished) break;
    const batter=currentBatter(game);
    const play=resolveAtBat(batter,game.bases,game);
    applyPlay(game,play);
    it++;
  }
  return game;
}

const RETIREMENT_AGE = 45; // これを超えたら強制引退
// 45歳を超えた選手を強制引退させ、若手にごっそり入れ替える（ガチャの保護は無関係。年齢だけで判定）
function forceRetireOldPlayers(t){
  const retiredList = [];
  t.roster.forEach((p,idx)=>{
    if(p.age > RETIREMENT_AGE){
      retirePlayer(t, p);
      const otherNames = t.roster.filter((pp,i)=>i!==idx).map(pp=>pp.name);
      const identity = pickPlayerIdentity(otherNames);
      const incoming = createPlayer(p.pos, identity, true, (DB.currentSeasonNum||1)+1);
      incoming.number = pickUniformNumber(t.roster.filter((pp,i)=>i!==idx).map(pp=>pp.number));
      t.roster[idx] = incoming;
      const boIdx = t.battingOrder.indexOf(p);
      if(boIdx>=0){
        t.battingOrder[boIdx] = incoming;
        incoming.ability = pickWeightedOrNone(ABILITY_AFFINITY[boIdx] || {});
      }
      retiredList.push({team:t, out:p, in:incoming});
    }
  });
  return retiredList;
}

// シーズン移行：チーム名・選手・編集内容・通算成績はそのまま、今シーズンの成績とスケジュール、ポストシーズンだけを新しくする
function startNewSeason(){
  // 今シーズン(リセット前)の順位からAクラス/Bクラスを判定し、監督の進退に反映する
  const {H:standH, B:standB} = finalizeStandings();
  const rankMap = {};
  standH.forEach((t,i)=>rankMap[t.id]=i+1);
  standB.forEach((t,i)=>rankMap[t.id]=i+1);

  let allRetired = [];
  const managerChanges = [];
  DB.teams.forEach(t=>{
    const rank = rankMap[t.id] || 1;
    t.consecutiveBClass = (rank>3) ? (t.consecutiveBClass||0)+1 : 0;

    reorderBattingOrderByPerformance(t); // 今シーズンの成績（実績が薄い選手は基礎能力）をもとに、来シーズンの打順を自動で組み直す

    t.wins=0; t.losses=0; t.ties=0; t.runsFor=0; t.runsAgainst=0;
    t.roster.forEach(p=>resetPlayerForNewSeason(p));
    allRetired = allRetired.concat(forceRetireOldPlayers(t));

    if(t.manager) t.manager.tenureYears--;
    const shouldReplace = !t.manager || t.manager.tenureYears<=0 || t.consecutiveBClass>=3;
    if(shouldReplace){
      const oldLabel = t.manager ? t.manager.label : null;
      const reason = (t.manager && t.manager.tenureYears<=0) ? '任期満了' : (t.consecutiveBClass>=3 ? `Bクラス${t.consecutiveBClass}年連続` : '新規就任');
      if(t.manager){
        if(!t.managerHistory) t.managerHistory = [];
        t.managerHistory.push(Object.assign({}, t.manager, {leftSeason: DB.currentSeasonNum||1}));
      }
      hireNewManager(t);
      managerChanges.push({team:t.name, from:oldLabel, to:t.manager.label, reason});
      t.consecutiveBClass = 0; // 新監督で心機一転
    }
  });
  DB.lastForcedRetirements = allRetired; // シーズン移行直後に一覧表示するため保持
  DB.lastManagerChanges = managerChanges;
  DB.currentSeasonNum = (DB.currentSeasonNum||1) + 1;
  DB.schedule = createSchedule(DB.teams);
  DB.postseason = null;
  DB.gachaDoneThisCycle = false;
  if(typeof clearHoldTimers==='function') clearHoldTimers();
  UI.liveGame = null; UI.flash=null; UI.rosterTeamId=null; UI.gachaResults=null; UI.gachaSelecting=false; UI.gachaMySelection=null;
}

function fmt3(n){ return isFinite(n) ? n.toFixed(3).replace(/^0\./,'.') : '.---'; }
function fmt3plain(n){ return isFinite(n) ? n.toFixed(3) : '.000'; } // SLG/OPSは1.000を超えうるので先頭の0を消さない
function avgOfStats(s){ return s.ab>0 ? s.h/s.ab : 0; }
function obpOfStats(s){ const d=s.ab+s.bb+s.sac; return d>0 ? (s.h+s.bb)/d : 0; }
function slgOfStats(s){
  const singles = s.h - s.doubles - s.triples - s.hr;
  const total = singles*1 + s.doubles*2 + s.triples*3 + s.hr*4;
  return s.ab>0 ? total/s.ab : 0;
}
function opsOfStats(s){ return obpOfStats(s) + slgOfStats(s); }
function avgOf(p){ return avgOfStats(p.stats); }
function obpOf(p){ return obpOfStats(p.stats); }
function slgOf(p){ return slgOfStats(p.stats); }
function opsOf(p){ return opsOfStats(p.stats); }
function winPct(t){ const d=t.wins+t.losses; return d>0 ? t.wins/d : 0; }

function linescoreHTML(game){
  const maxInning = Math.max(9, game.inning, (game.inningRuns.home||[]).length, (game.inningRuns.away||[]).length);
  const awayArr = game.inningRuns.away||[], homeArr = game.inningRuns.home||[];
  function cell(arr, i, otherLen){
    if(i < arr.length) return arr[i];
    // ホームが裏を戦わずに終わった回（サヨナラ・逃げ切り）は「X」で表す
    if(game.finished && i < otherLen) return 'X';
    return '';
  }
  let head = '<th class="namehead"></th>';
  for(let i=0;i<maxInning;i++) head += `<th>${i+1}</th>`;
  head += '<th>R</th><th>H</th><th>E</th>';
  const awayRow = `<tr><td class="name">${game.away.name}</td>` +
    Array.from({length:maxInning},(_,i)=>`<td>${cell(awayArr,i,homeArr.length)}</td>`).join('') +
    `<td class="hl">${game.score.away}</td><td>${game.hits.away}</td><td>${game.errors.away}</td></tr>`;
  const homeRow = `<tr><td class="name">${game.home.name}</td>` +
    Array.from({length:maxInning},(_,i)=>`<td>${cell(homeArr,i,awayArr.length)}</td>`).join('') +
    `<td class="hl">${game.score.home}</td><td>${game.hits.home}</td><td>${game.errors.home}</td></tr>`;
  return `<table class="linescore">
    <thead><tr>${head}</tr></thead>
    <tbody>${awayRow}${homeRow}</tbody>
  </table>`;
}

var holdStartTimer = null;
var holdRepeatTimer = null;
const HOLD_THRESHOLD_MS = 350; // このくらい押し続けたら早送りモードに入る
const HOLD_REPEAT_MS = 90;     // 早送り中、1打席を処理する間隔

function clearHoldTimers(){
  if(holdStartTimer){ clearTimeout(holdStartTimer); holdStartTimer=null; }
  if(holdRepeatTimer){ clearInterval(holdRepeatTimer); holdRepeatTimer=null; }
}
function pressRoll(){
  if(UI.rolling || !UI.liveGame || UI.liveGame.finished) return;
  const gameRef = UI.liveGame;
  doRoll(); // 通常の1回分は、これまで通りアニメーション付きで転がす
  clearHoldTimers();
  holdStartTimer = setTimeout(()=>{
    holdRepeatTimer = setInterval(()=>{
      if(UI.tab!=='play' || UI.liveGame!==gameRef || UI.liveGame.finished){ clearHoldTimers(); return; }
      // 早送り中はアニメーションを省略し、1打席ずつ素早く処理して都度再描画する
      rollStep(UI.liveGame);
      render();
    }, HOLD_REPEAT_MS);
  }, HOLD_THRESHOLD_MS);
}
function releaseRoll(){
  clearHoldTimers();
}

function doRoll(){
  if(UI.rolling || !UI.liveGame || UI.liveGame.finished) return;
  const game = UI.liveGame;
  const wasAwaiting = game.pencilStage==='awaitingPencil2';
  UI.rolling = true;
  const rollBtn = $('#rollBtn'); if(rollBtn) rollBtn.disabled = true;

  const res = rollStep(game); // engine resolves synchronously

  const hexId = wasAwaiting ? '#hex2' : '#hex1';
  const hex = $(hexId);
  const faces = wasAwaiting ? P2_FACES : P1_FACES;
  if(hex) hex.classList.add('spin');

  // 初期仕様：一定間隔でフリップして、すぐ結果を見せる（約0.5秒）
  let spins = 0;
  const spinTimer = setInterval(()=>{
    if(hex) hex.textContent = FACE_LABEL[choice(faces)];
    spins++;
    if(spins>7){
      clearInterval(spinTimer);
      if(hex) hex.textContent = FACE_LABEL[wasAwaiting ? res.p2 : res.p1];
      UI.rolling = false;
      render();
    }
  }, 60);
}

/* ---------- standings tab ---------- */
function headToHeadPct(teamA, teamB){
  const games = DB.schedule.filter(g=>g.played && (
    (g.home===teamA.id && g.away===teamB.id) || (g.home===teamB.id && g.away===teamA.id)
  ));
  let winsA=0, decisive=0;
  games.forEach(g=>{
    if(g.result.winner==='tie') return;
    decisive++;
    const winnerId = g.result.winner==='home' ? g.home : g.away;
    if(winnerId===teamA.id) winsA++;
  });
  return decisive>0 ? winsA/decisive : 0.5;
}
// 同率首位の決め方はセ・パで違う、という実際のNPBルールを簡易再現：
// イーストリーグ＝セ・リーグ方式：勝率→勝利数→直接対決
// ウエストリーグ＝パ・リーグ方式：勝率→直接対決→勝利数
function sortStandings(list, leagueCode){
  return list.slice().sort((a,b)=>{
    const pa=winPct(a), pb=winPct(b);
    if(pa!==pb) return pb-pa;
    if(leagueCode==='H'){
      if(a.wins!==b.wins) return b.wins-a.wins;
      const hh = headToHeadPct(a,b);
      if(hh!==0.5) return hh>0.5?-1:1;
      return 0;
    } else {
      const hh = headToHeadPct(a,b);
      if(hh!==0.5) return hh>0.5?-1:1;
      if(a.wins!==b.wins) return b.wins-a.wins;
      return 0;
    }
  });
}
function finalizeStandings(){
  return {
    H: sortStandings(DB.teams.filter(t=>t.league===LEAGUE_CODES[0]),'H'),
    B: sortStandings(DB.teams.filter(t=>t.league===LEAGUE_CODES[1]),'B'),
  };
}
function gamesBehind(leader, team){
  if(leader.id===team.id) return '-';
  const gb = ((leader.wins-team.wins)+(team.losses-leader.losses))/2;
  return gb.toFixed(1);
}
function regularSeasonComplete(){ return DB.schedule.length>0 && DB.schedule.every(g=>g.played); }

  if(regularSeasonComplete()){

// 対戦成績マトリクス：行チームから見た、列チームとの通算対戦成績（勝-敗-分）
function headToHeadMatrixHTML(){
  const teams = DB.teams;
  const headerCells = teams.map(t=>`<th style="font-size:9.5px;white-space:nowrap;">${t.name.slice(0,4)}</th>`).join('');
  const rows = teams.map(t1=>{
    const cells = teams.map(t2=>{
      if(t1.id===t2.id) return '<td class="muted">―</td>';
      const games = DB.schedule.filter(g=>g.played && ((g.home===t1.id&&g.away===t2.id)||(g.home===t2.id&&g.away===t1.id)));
      let w=0,l=0,tt=0;
      games.forEach(g=>{
        const t1IsHome = g.home===t1.id;
        if(g.result.winner==='tie') tt++;
        else if((g.result.winner==='home')===t1IsHome) w++;
        else l++;
      });
      return `<td style="font-size:10px;">${w}-${l}${tt?'-'+tt:''}</td>`;
    }).join('');
    return `<tr><td class="name" style="white-space:nowrap;">${t1.name}</td>${cells}</tr>`;
  }).join('');
  return `<details class="howto">
    <summary>対戦成績マトリクス（行チーム視点の対 列チーム 勝-敗-分）</summary>
    <div class="table-scroll" style="margin-top:8px;">
    <table><thead><tr><th></th>${headerCells}</tr></thead><tbody>${rows}</tbody></table>
    </div>
  </details>`;
}

/* ---------- postseason (CS / 日本シリーズ) ---------- */
function makeSeries(teamA, teamB, winsToClinch, advA, advB, label){
  return { teamA, teamB, winsA:advA||0, winsB:advB||0, winsToClinch, games:[], winner:null, label };
}
function startPostseason(){
  const {H,B} = finalizeStandings();
  DB.teams.forEach(t=>t.roster.forEach(p=>{ p.psStats = emptyStatLine(); }));
  DB.postseason = {
    standings:{H,B},
    series:{
      H1: makeSeries(H[1],H[2],2,0,0,leagueName('H')+' ファーストステージ（2位 vs 3位・2勝先取）'),
      B1: makeSeries(B[1],B[2],2,0,0,leagueName('B')+' ファーストステージ（2位 vs 3位・2勝先取）'),
      H2: null, B2: null, JS: null,
    },
    champion: null,
  };
}
function progressPostseason(){
  const ps = DB.postseason;
  if(!ps) return;
  const {H,B} = ps.standings;
  if(!ps.series.H2 && ps.series.H1.winner){
    ps.series.H2 = makeSeries(H[0], ps.series.H1.winner, 4, 1, 0, leagueName('H')+' ファイナルステージ（1位に1勝のアドバンテージ・4勝先取）');
  }
  if(!ps.series.B2 && ps.series.B1.winner){
    ps.series.B2 = makeSeries(B[0], ps.series.B1.winner, 4, 1, 0, leagueName('B')+' ファイナルステージ（1位に1勝のアドバンテージ・4勝先取）');
  }
  if(!ps.series.JS && ps.series.H2 && ps.series.H2.winner && ps.series.B2 && ps.series.B2.winner){
    ps.series.JS = makeSeries(ps.series.H2.winner, ps.series.B2.winner, 4, 0, 0, '日本シリーズ（4勝先取）');
  }
  if(ps.series.JS && ps.series.JS.winner){
    ps.champion = ps.series.JS.winner;
  }
}
// レギュラーシーズン終了後、ポストシーズンが未完了なら残り全てを自動で消化する（新シーズンへ進む前に必ず決着をつける）
function autoCompletePostseason(){
  if(!DB.postseason) startPostseason();
  let guard = 0;
  while(!DB.postseason.champion && guard < 100){
    progressPostseason();
    ['H1','B1','H2','B2','JS'].forEach(key=>{
      const s = DB.postseason.series[key];
      if(s && !s.winner){
        const game = newGame(s.teamA, s.teamB, null);
        game.seriesKey = key;
        autoSimGame(game);
      }
    });
    guard++;
  }
  progressPostseason();
}
function postseasonSectionHTML(){
  progressPostseason();
  let html = '';

  if(!DB.postseason){
    html += `<div class="card">
      <div class="muted" style="margin-bottom:8px;">ポストシーズンは、ここから1試合ずつ「観る」または「自動」で進めます（「試合」カードの一括自動シミュレートボタンでもまとめて消化できます）。</div>
      <button class="btn" id="startPostseasonBtn">クライマックスシリーズを開始</button>
    </div>`;
    return html;
  }

  function seriesCard(s){
    if(!s) return '';
    if(s.winner){
      // 決着済みシリーズはコンパクトに1行で表示（各戦の詳細は折りたたみ）
      const gamesHtml = s.games.map((g,i)=>{
        const h=teamById(g.homeId), a=teamById(g.awayId);
        return `<div class="game-row"><div class="vs">第${i+1}戦　${a.name} ${g.scoreAway} - ${g.scoreHome} ${h.name}${g.tie?'（引分・再戦）':''}</div></div>`;
      }).join('');
      return `<details class="howto">
        <summary>${s.label}：${s.teamA.name} ${s.winsA}-${s.winsB} ${s.teamB.name}　→ ${s.winner.name}突破</summary>
        <div style="margin-top:8px;">${gamesHtml}</div>
      </details>`;
    }
    const gamesHtml = s.games.map((g,i)=>{
      const h=teamById(g.homeId), a=teamById(g.awayId);
      return `<div class="game-row"><div class="vs">第${i+1}戦　${a.name} ${g.scoreAway} - ${g.scoreHome} ${h.name}${g.tie?'（引分・再戦）':''}</div></div>`;
    }).join('');
    const nextNum = s.games.length+1;
    const actionHtml = `<div class="row" style="margin-top:6px;">
        <button class="btn small" data-psplay="${s._key}">第${nextNum}戦を観る</button>
        <button class="btn small secondary" data-pssim="${s._key}">第${nextNum}戦を自動</button>
      </div>`;
    return `<div class="card">
      <h2>${s.label}</h2>
      <div class="muted">${s.teamA.name} ${s.winsA} - ${s.winsB} ${s.teamB.name}</div>
      ${gamesHtml}
      ${actionHtml}
    </div>`;
  }
  ['H1','B1','H2','B2','JS'].forEach(key=>{ if(DB.postseason.series[key]) DB.postseason.series[key]._key = key; });
  html += seriesCard(DB.postseason.series.H1);
  html += seriesCard(DB.postseason.series.B1);
  html += seriesCard(DB.postseason.series.H2);
  html += seriesCard(DB.postseason.series.B2);
  html += seriesCard(DB.postseason.series.JS);

  if(DB.postseason.champion){
    html += `<div class="finish-banner"><div>日本一</div><div class="score">${DB.postseason.champion.name}</div></div>`;
  }
  return html;
}

  const dupe = contextPlayers.filter(x=>x.name===player.name).length > 1;
  if(!dupe) return player.name;
  return `<span style="position:relative;display:inline-block;padding-right:11px;">${player.name}<span style="position:absolute;right:-2px;bottom:-4px;font-size:9.5px;line-height:1;color:var(--pencil);font-weight:700;">${player.given.charAt(0)}</span></span>`;
}

/* ---------- 球団史（シーズンをまたいだ記録。ブラウザの永続ストレージに保存） ---------- */
function computeSeasonLeaders(){
  let all = [];
  DB.teams.forEach(t=>t.roster.forEach(p=>all.push({p,t})));
  const qualified = all.filter(x=>x.p.stats.ab>=10);
  function top3(list, calc){
    return list.slice().sort((a,b)=>calc(b.p)-calc(a.p)).slice(0,3)
      .map(x=>({name:x.p.name, team:x.t.name, value:calc(x.p)}));
  }
  return {
    avg: top3(qualified, p=>avgOf(p)),
    hr: top3(all, p=>p.stats.hr),
    rbi: top3(all, p=>p.stats.rbi),
  };
}
// シーズンMVP：規定打数(10打数)以上でOPS最高の選手
// シーズンMVP：規定打数(10打数)以上でOPS最高の選手を、リーグごとに選出
function computeSeasonMVP(){
  const result = {H:null, B:null};
  [['H',LEAGUE_CODES[0]],['B',LEAGUE_CODES[1]]].forEach(([outKey,code])=>{
    let all = [];
    DB.teams.filter(t=>t.league===code).forEach(t=>t.roster.forEach(p=>{ if(p.stats.ab>=10) all.push({p,t}); }));
    if(!all.length) return;
    const best = all.slice().sort((a,b)=>opsOf(b.p)-opsOf(a.p))[0];
    best.p.awards.mvp++;
    result[outKey] = {name:best.p.name, team:best.t.name, ops:opsOf(best.p), avg:avgOf(best.p), hr:best.p.stats.hr, rbi:best.p.stats.rbi};
  });
  return result;
}
// ポストシーズンMVP：日本一になったチームの選手の中から、ポストシーズンOPS最高の選手を選出
function computePostseasonMVP(){
  if(!DB.postseason || !DB.postseason.champion) return null;
  const champTeam = DB.postseason.champion;
  const candidates = champTeam.roster.filter(p=>p.psStats && p.psStats.ab>=3);
  if(!candidates.length) return null;
  const best = candidates.slice().sort((a,b)=>opsOfStats(b.psStats)-opsOfStats(a.psStats))[0];
  best.awards.psMvp++;
  return {name:best.name, team:champTeam.name, ops:opsOfStats(best.psStats), avg:avgOfStats(best.psStats), hr:best.psStats.hr, rbi:best.psStats.rbi};
}
// ベストナイン：リーグごとに、守備位置ごとの最高OPS選手を選出（規定打数10以上）
function computeBestNine(){
  const result = {H:[], B:[]};
  [['H',LEAGUE_CODES[0]],['B',LEAGUE_CODES[1]]].forEach(([outKey,code])=>{
    POSITIONS.forEach(pos=>{
      let candidates = [];
      DB.teams.filter(t=>t.league===code).forEach(t=>t.roster.forEach(p=>{ if(p.pos===pos && p.stats.ab>=10) candidates.push({p,t}); }));
      if(!candidates.length) return;
      const best = candidates.slice().sort((a,b)=>opsOf(b.p)-opsOf(a.p))[0];
      best.p.awards.bestNine++;
      result[outKey].push({pos, name:best.p.name, team:best.t.name, ops:opsOf(best.p), avg:avgOf(best.p), hr:best.p.stats.hr});
    });
  });
  return result;
}
// 新人王：在籍0年目（＝今シーズンが初年度）の選手の中から、リーグごとにOPS最高の選手を選出
function computeRookieOfYear(){
  const result = {H:null, B:null};
  [['H',LEAGUE_CODES[0]],['B',LEAGUE_CODES[1]]].forEach(([outKey,code])=>{
    let all = [];
    DB.teams.filter(t=>t.league===code).forEach(t=>t.roster.forEach(p=>{ if((p.seasonsPlayed||0)===0 && p.stats.ab>=10) all.push({p,t}); }));
    if(!all.length) return;
    const best = all.slice().sort((a,b)=>opsOf(b.p)-opsOf(a.p))[0];
    best.p.awards.rookie++;
    result[outKey] = {name:best.p.name, team:best.t.name, ops:opsOf(best.p), avg:avgOf(best.p), hr:best.p.stats.hr, rbi:best.p.stats.rbi};
  });
  return result;
}
// ゴールデングラブ賞：リーグ・守備位置ごとに、規定出場ある中で失策が最も少ない選手を選出（同数ならOPSで判定）
function computeGoldenGlove(){
  const result = {H:[], B:[]};
  [['H',LEAGUE_CODES[0]],['B',LEAGUE_CODES[1]]].forEach(([outKey,code])=>{
    POSITIONS.forEach(pos=>{
      let candidates = [];
      DB.teams.filter(t=>t.league===code).forEach(t=>t.roster.forEach(p=>{ if(p.pos===pos && p.stats.pa>=10) candidates.push({p,t}); }));
      if(!candidates.length) return;
      const best = candidates.slice().sort((a,b)=> (a.p.stats.errors-b.p.stats.errors) || (opsOf(b.p)-opsOf(a.p)))[0];
      best.p.awards.goldenGlove++;
      result[outKey].push({pos, name:best.p.name, team:best.t.name, errors:best.p.stats.errors});
    });
  });
  return result;
}
var IN_MEMORY_SEASON_HISTORY = null; // window.storageが使えない環境向けのフォールバック（このブラウザタブを閉じるまでは保持される）
var STORAGE_AVAILABLE = (typeof window!=='undefined' && !!window.storage);

async function loadSeasonHistory(){
  if(!STORAGE_AVAILABLE){
    if(IN_MEMORY_SEASON_HISTORY===null) IN_MEMORY_SEASON_HISTORY = [];
    return IN_MEMORY_SEASON_HISTORY;
  }
  try{
    const res = await window.storage.get('season-history', false);
    if(res && res.value) return JSON.parse(res.value);
  } catch(e){ /* no history saved yet */ }
  return [];
}
function sleep(ms){ return new Promise(res=>setTimeout(res, ms)); }
async function saveSeasonHistory(history){
  if(!STORAGE_AVAILABLE){
    IN_MEMORY_SEASON_HISTORY = history;
    return true;
  }
  const payload = JSON.stringify(history);
  let lastErr = null;
  for(let attempt=0; attempt<3; attempt++){
    try{
      const result = await window.storage.set('season-history', payload, false);
      if(result) return true;
      lastErr = 'window.storage.set returned no result';
    } catch(e){
      lastErr = (e && e.message) ? e.message : String(e);
    }
    if(attempt<2) await sleep(400*(attempt+1)); // 少し間隔を空けて再試行（一時的な失敗を救う）
  }
  DB.lastStorageError = lastErr + '（3回試行）';
  return false;
}
// 自チームの選手個人成績のスナップショット（球団史で選手ごとの成績推移を見られるように）
function buildMyTeamRosterSnapshot(){
  if(!UI.myTeamId) return null;
  const t = teamById(UI.myTeamId);
  if(!t) return null;
  return {
    teamId: t.id,
    teamName: t.name,
    players: t.battingOrder.map((p,i)=>({
      order:i+1, name:p.name, pos:p.pos,
      pa:p.stats.pa, ab:p.stats.ab, h:p.stats.h,
      doubles:p.stats.doubles, triples:p.stats.triples, hr:p.stats.hr,
      rbi:p.stats.rbi, bb:p.stats.bb, k:p.stats.k,
      avg:avgOf(p), ops:opsOf(p),
    })),
  };
}
async function archiveCurrentSeason(){
  const {H,B} = finalizeStandings();
  const history = await loadSeasonHistory();
  const nextNum = history.length ? Math.max(...history.map(s=>s.seasonNum))+1 : 1;
  const record = {
    seasonNum: nextNum,
    savedAt: new Date().toISOString(),
    leagueNames: { H: leagueName('H'), B: leagueName('B') },
    standings: {
      H: H.map((t,i)=>({teamId:t.id, name:t.name, rank:i+1, wins:t.wins, losses:t.losses, ties:t.ties})),
      B: B.map((t,i)=>({teamId:t.id, name:t.name, rank:i+1, wins:t.wins, losses:t.losses, ties:t.ties})),
    },
    champion: (DB.postseason && DB.postseason.champion) ? DB.postseason.champion.name : null,
    championTeamId: (DB.postseason && DB.postseason.champion) ? DB.postseason.champion.id : null,
    leaders: computeSeasonLeaders(),
    mvp: computeSeasonMVP(),
    postseasonMvp: computePostseasonMVP(),
    bestNine: computeBestNine(),
    rookieOfYear: computeRookieOfYear(),
    goldenGlove: computeGoldenGlove(),
  };
  history.push(record);
  const saved = await saveSeasonHistory(history);
  if(!saved){
    const err = new Error(DB.lastStorageError || 'storage unavailable');
    err.record = record; // 保存に失敗しても、この場で計算したシーズン結果自体は失わない
    throw err;
  }
  return record;
}

    .sort((a,b)=>(b.awards.mvp+b.awards.bestNine+b.awards.psMvp+b.awards.rookie+b.awards.goldenGlove)-(a.awards.mvp+a.awards.bestNine+a.awards.psMvp+a.awards.rookie+a.awards.goldenGlove)).slice(0,10)
    .map(x=>`<tr><td class="name">${x.name}（${x.team}${x.active?'':'・OB'}）</td><td>${x.awards.mvp}</td><td>${x.awards.bestNine}</td><td>${x.awards.psMvp}</td><td>${x.awards.rookie}</td><td>${x.awards.goldenGlove}</td></tr>`).join('');
  const allTimeHtml = allTimePlayers.length ? `<details class="howto" style="margin-bottom:10px;">
    <summary>歴代個人成績トップ10（現役＋引退選手・通算／在籍10年以上）</summary>
    <div style="margin-top:8px;">
      ${qualifiedCount===0 ? '<div class="muted">在籍10年以上の選手がまだいません。</div>' : `
      ${statTable('通算打率', x=>avgOfStats(x.career), x=>fmt3(avgOfStats(x.career)))}
      ${statTable('通算安打', x=>x.career.h, x=>x.career.h+'本')}
      ${statTable('通算本塁打', x=>x.career.hr, x=>x.career.hr+'本')}
      ${statTable('通算打点', x=>x.career.rbi, x=>x.career.rbi+'点')}
      ${statTable('通算盗塁', x=>x.career.sb||0, x=>(x.career.sb||0)+'個')}
      ${statTable('通算OPS', x=>opsOfStats(x.career), x=>fmt3plain(opsOfStats(x.career)))}
      <div style="font-weight:800;color:var(--pencil);margin-top:8px;">受賞歴（MVP／ベストナイン／CS MVP／新人王／ゴールデングラブ）</div>
      <table class="compact-table"><thead><tr><th class="namehead">選手</th><th>MVP</th><th>BN</th><th>CS</th><th>新人</th><th>GG</th></tr></thead>
      <tbody>${awardRows || '<tr><td colspan="6" class="muted">まだ受賞者がいません。</td></tr>'}</tbody></table>`}
    </div>
  </details>` : '';

  return `<div class="card"><h2>球団史</h2><div class="muted">これまでのシーズンの最終成績を記録しています（${STORAGE_AVAILABLE?'この端末に保存され、次に開いたときも残ります':'このブラウザタブを開いている間だけ保持されます。タブを閉じたり再読み込みすると消えます'}）。チーム名・選手はシーズンをまたいで引き継がれ、オフシーズンごとに各球団1名だけガチャで入れ替わります。</div></div>${trendHtml}${teamTotalsHtml}${rankHtml}${managerHistoryHtml}${allTimeHtml}${cards}`;
}

render();
</script>
</body>
</html>
